[project]
name = "ht-backtest"
version = "0.1.0"
description = "Headless backtest engine porting the Holy Trinity v10 Pine spec"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ht-backtest = "ht_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

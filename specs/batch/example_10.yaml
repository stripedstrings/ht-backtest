# Batch of 10 registered strategies on the locked v1 split.
# Comparison table is TRAIN reach vs 1/(1+T) only.
split: v1
timeframe: 15m
exchange: binanceusdm
cache_dir: data/raw
splits_dir: specs/splits
out_dir: data/runs
mfe_win: 100
workers: 4
min_edge_pp: 5.0
min_n: 200
use_primitive_cache: true
strategies:
  - ht_v10
  - london_open_long_atr1
  - london_open_short_atr1
  - ny_open_long_atr1
  - ny_open_short_atr1
  - donchian_20_long
  - donchian_20_short
  - sma50_mom_long
  - sma50_mom_short
  - mr_extrema_10_long
